[tox]
requires =
    tox>=4.2
env_list =
    py313
    py312
    py311
    py310
    py39

[testenv]
runner = uv-venv-lock-runner
package = wheel
wheel_build_env = .pkg
set_env =
    PYTHONDEVMODE = 1
commands =
    python \
      -W error::ResourceWarning \
      -W error::DeprecationWarning \
      -W error::PendingDeprecationWarning \
      -m coverage run \
      -m unittest test/test_grist_api.py
dependency_groups =
    test
